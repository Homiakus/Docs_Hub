{{define "content"}}
<div class="empty-state" style="max-width: 620px; margin: 60px auto; text-align: left; justify-items: start; padding: clamp(32px, 6vw, 64px);">
  <span style="font-family: var(--font-mono); font-size: clamp(3.5rem, 8vw, 6rem); line-height: 0.9; font-weight: 800; letter-spacing: -0.05em; margin: 0; color: var(--text-primary); background: none; width: auto; height: auto; border-radius: 0;">404</span>
  <div style="display: grid; gap: 8px; margin: 20px 0 28px;">
    <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> Исключение // Документ не найден</p>
    <h1 style="font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 750; margin: 0;">Index Dereference Error</h1>
    <p class="u-muted" style="font-size: 0.88rem; max-width: 50ch; margin: 0;">Запрошенный документ или ресурс не существует в индексе базы знаний, либо был перемещён в другое пространство.</p>
  </div>
  <div>
    <a class="btn btn-primary" href="/">Вернуться на главную <span aria-hidden="true">→</span></a>
  </div>
</div>
{{end}}
