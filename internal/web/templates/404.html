{{define "content"}}
<div class="auth-card" style="text-align: left;">
  <p style="font-family: var(--font-mono); font-size: clamp(64px, 10vw, 110px); line-height: 0.9; font-weight: 800; letter-spacing: -0.05em; margin: 0; color: var(--text);">404</p>
  <div style="display: grid; gap: 8px; margin: 16px 0 24px;">
    <p class="eyebrow">Exception // Resource Not Found</p>
    <h1 style="font-size: 24px; font-weight: 750;">Index Dereference Error</h1>
    <p class="u-muted" style="font-size: 13.5px;">The requested document slug does not exist in the knowledge index or has been relocated.</p>
  </div>
  <div>
    <a class="button primary" href="/">Return to Knowledge Index &rarr;</a>
  </div>
</div>
{{end}}
