{{define "components/document_card"}}
<article class="doc-card" style="display: grid; gap: var(--space-2); padding: var(--space-4); background-color: var(--surface-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); transition: border-color var(--transition-fast), box-shadow var(--transition-fast);">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);">
    <h3 style="font-size: 1rem; font-weight: 600; margin: 0;">
      <a href="{{articlePath .Slug}}" style="color: var(--text-primary); text-decoration: none;">{{.Title}}</a>
    </h3>
    <span class="badge badge-{{.Status}}">{{.Status}}</span>
  </div>
  {{if .Content}}
  <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;">
    {{.Content}}
  </p>
  {{end}}
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--text-tertiary); margin-top: var(--space-1);">
    <span>Обновлено: {{.UpdatedAt}}</span>
    <span>{{.Visibility}}</span>
  </div>
</article>
{{end}}
