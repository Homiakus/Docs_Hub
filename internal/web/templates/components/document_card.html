{{define "components/document_card"}}
<article class="doc-card editorial-row">
  <a class="doc-card-link" href="{{articlePath .Slug}}" aria-label="Открыть документ: {{.Title}}"></a>
  <div class="doc-card-head">
    <span class="doc-type-icon" aria-hidden="true">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    </span>
    <div class="doc-card-title-wrap">
      <h3>{{.Title}}</h3>
      <p>{{if .SpaceName}}{{.SpaceName}}{{else}}Общее пространство{{end}}{{if .Category}} · #{{.Category}}{{end}}</p>
    </div>
    <div class="doc-card-badges">
      <span class="badge badge-{{.Status}}">{{statusLabel .Status}}</span>
      <span class="classification-chip">{{.Classification}}</span>
    </div>
  </div>
  {{if .Content}}<p class="doc-card-excerpt">{{.Content}}</p>{{end}}
  <footer class="doc-card-meta">
    <span>Обновлено {{.UpdatedAt}}</span>
    <span class="doc-row-arrow" aria-hidden="true">
      <svg class="icon icon-xs" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </footer>
</article>
{{end}}
