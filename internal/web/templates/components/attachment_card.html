{{define "components/attachment_card"}}
<article class="attachment-card">
  <span class="attachment-icon" aria-hidden="true">↧</span>
  <div><h4>{{.OriginalName}}</h4><p>{{.SizeBytes}} байт · {{.MIME}}</p></div>
  <a href="/uploads/{{.StorageKey}}" download class="btn btn-secondary btn-sm">Скачать</a>
</article>
{{end}}
