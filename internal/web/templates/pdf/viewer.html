{{define "content"}}
<div class="pdf-viewer-page page-stack">
  <header class="pagehead pdf-head">
    <div><span class="eyebrow">PDF-вложение</span><h1>{{.PDFName}}</h1><p>Безопасный просмотр файла внутри базы знаний.</p></div>
    <div class="pdf-actions">
      <div class="pdf-pagination" role="group" aria-label="Навигация по страницам">
        <button class="btn btn-secondary btn-sm" type="button" id="pdfPrevPage" aria-label="Предыдущая страница">←</button>
        <label>Страница <input type="number" id="pdfPageInput" value="1" min="1" max="{{.PDFPageCount}}"> из <span id="pdfTotalPages">{{.PDFPageCount}}</span></label>
        <button class="btn btn-secondary btn-sm" type="button" id="pdfNextPage" aria-label="Следующая страница">→</button>
      </div>
      <a class="btn btn-primary btn-sm" href="{{.PDFURL}}" download>Скачать PDF</a>
    </div>
  </header>

  <div class="pdf-viewer-container" id="pdfViewerContainer" data-total-pages="{{.PDFPageCount}}" data-pdf-url="{{.PDFURL}}">
    <iframe id="pdfFrame" src="{{.PDFURL}}#page=1&view=FitH" title="PDF: {{.PDFName}}"></iframe>
  </div>
  <p class="pdf-fallback">Если файл не открылся, <a href="{{.PDFURL}}" target="_blank" rel="noopener">откройте его в новой вкладке</a>.</p>
</div>
<script defer src="/static/js/pdf/pdf-viewer.js"></script>
{{end}}
