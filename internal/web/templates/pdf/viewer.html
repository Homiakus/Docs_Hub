{{define "content"}}
<div class="pdf-viewer-page">
  <div class="pagehead">
    <div>
      <span class="eyebrow">PDF Viewer</span>
      <h1 class="text-page-title">Просмотр PDF документа</h1>
    </div>
    <div style="display: flex; align-items: center; gap: var(--space-2);">
      <button class="btn btn-secondary btn-sm" id="pdfPrevPage">← Назад</button>
      <span style="font-size: 0.875rem;">Стр. <input type="number" id="pdfPageInput" value="1" min="1" style="width: 50px; padding: 2px 4px; display: inline-block;"> из <span id="pdfTotalPages">1</span></span>
      <button class="btn btn-secondary btn-sm" id="pdfNextPage">Вперед →</button>
    </div>
  </div>

  <div id="pdfViewerContainer" data-total-pages="10" style="margin-top: var(--space-4); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; height: 75vh;">
    <iframe src="" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>
</div>

<script defer src="/static/js/pdf/pdf-viewer.js"></script>
{{end}}
