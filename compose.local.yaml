name: docshub-local

services:
  docshub:
    build:
      context: .
    env_file:
      - .env.local
    environment:
      ADDR: ":8080"
      DATA_DIR: "/data"
      COOKIE_SECURE: "0"
      TLS_ENABLED: "0"
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./data-local:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/docshub", "healthcheck", "--url=http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
