name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o /dev/null ./cmd/docshub

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docshub-next .

  ui:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install UI test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral UI test credentials
        run: |
          admin_password="$(openssl rand -hex 16)"
          session_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$admin_password"
          printf '::add-mask::%s\n' "$session_secret"
          printf 'E2E_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
          printf 'E2E_SESSION_SECRET=%s\n' "$session_secret" >> "$GITHUB_ENV"

      - name: Run UI, responsive and accessibility tests
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
