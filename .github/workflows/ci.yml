name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Vulnerability Scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          check-latest: true

      - name: Run Unit & Integration Tests (Race & Coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build CLI & Server Binaries
        run: |
          go build -o /dev/null ./cmd/docshub
          go build -o /dev/null ./cmd/docshub-seed
          go build -o /dev/null ./cmd/migrate-json

  docker:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: docshub-next:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    name: E2E & Responsive Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate Ephemeral E2E Credentials
        run: |
          admin_password="$(openssl rand -hex 16)"
          session_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$admin_password"
          printf '::add-mask::%s\n' "$session_secret"
          printf 'E2E_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
          printf 'E2E_SESSION_SECRET=%s\n' "$session_secret" >> "$GITHUB_ENV"

      - name: Execute Playwright Matrix
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
